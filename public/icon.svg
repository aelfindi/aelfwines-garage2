<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#1C1C1E"/>

  <!-- Rear wheel -->
  <circle cx="145" cy="322" r="93" fill="none" stroke="#E8682A" stroke-width="26"/>
  <circle cx="145" cy="322" r="19" fill="#E8682A"/>

  <!-- Front wheel -->
  <circle cx="372" cy="322" r="77" fill="none" stroke="#E8682A" stroke-width="22"/>
  <circle cx="372" cy="322" r="15" fill="#E8682A"/>

  <!-- Main frame curve (rear hub → tank → front fork) -->
  <path d="M145 322 C168 238 218 196 278 192 C318 188 346 202 372 322"
        fill="none" stroke="#FAF7F2" stroke-width="22" stroke-linecap="round"/>

  <!-- Seat tube (down from saddle area to bottom bracket) -->
  <line x1="210" y1="206" x2="185" y2="288" stroke="#FAF7F2" stroke-width="15" stroke-linecap="round" opacity="0.8"/>
  <!-- Bottom bracket to rear wheel -->
  <line x1="185" y1="288" x2="145" y2="322" stroke="#FAF7F2" stroke-width="13" stroke-linecap="round" opacity="0.7"/>

  <!-- Second fork line -->
  <line x1="354" y1="214" x2="384" y2="322" stroke="#FAF7F2" stroke-width="11" stroke-linecap="round" opacity="0.55"/>

  <!-- Tank (filled orange shape) -->
  <path d="M220 192 Q260 160 302 192 L286 216 L236 216 Z" fill="#E8682A"/>

  <!-- Engine block -->
  <rect x="230" y="220" width="76" height="50" rx="10" fill="#2A5F8F"/>
  <!-- Engine highlight -->
  <rect x="238" y="228" width="26" height="8" rx="4" fill="#3A7FBF" opacity="0.7"/>
  <rect x="270" y="228" width="26" height="8" rx="4" fill="#3A7FBF" opacity="0.7"/>

  <!-- Seat (orange curved line) -->
  <path d="M170 274 Q212 252 254 248" fill="none" stroke="#E8682A" stroke-width="22" stroke-linecap="round"/>

  <!-- Handlebar -->
  <line x1="300" y1="186" x2="348" y2="163" stroke="#FAF7F2" stroke-width="16" stroke-linecap="round"/>
  <line x1="335" y1="153" x2="352" y2="170" stroke="#FAF7F2" stroke-width="13" stroke-linecap="round"/>
</svg>
